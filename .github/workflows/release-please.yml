name: release-please

on:
    push:
        branches:
            - master
    workflow_dispatch:
        inputs:
            vscode_release:
                description: "Publish VS Code extension"
                type: boolean
                default: false
            vscode_tag:
                description: "Tag to publish from (e.g., v0.4.0)"
                type: string
                required: false

permissions:
    contents: write
    pull-requests: write

jobs:
    release-please:
        name: Release Please
        runs-on: ubuntu-latest
        outputs:
            release_created: ${{ steps.release.outputs.release_created }}
            tag_name: ${{ steps.release.outputs.tag_name }}
        steps:
            - uses: googleapis/release-please-action@v4
              id: release
              with:
                  manifest-file: .github/.release-manifest.json
                  config-file: .github/.release-config.json
                  token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

    vscode-publish:
        name: Publish VS Code Extension
        needs: release-please
        if: ${{ (github.event_name == 'push' && needs.release-please.outputs.release_created) || (github.event_name == 'workflow_dispatch' && inputs.vscode_release == true) }}
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
              with:
                  ref: ${{ inputs.vscode_tag || github.ref }}

            - uses: oven-sh/setup-bun@v2

            - name: Install
              working-directory: vscode
              run: bun install --frozen-lockfile

            - name: Package
              working-directory: vscode
              run: |
                  # LICENSE and CHANGELOG live at the repo root; vsce only
                  # packages files inside the extension directory.
                  cp ../LICENSE ../CHANGELOG.md .
                  bunx vsce package --no-dependencies --out simple-light.vsix

            - name: Publish to VS Code Marketplace
              working-directory: vscode
              env:
                  VSCE_PAT: ${{ secrets.VSCE_PAT }}
              run: bunx vsce publish --no-dependencies --skip-duplicate --packagePath simple-light.vsix

            - name: Publish to Open VSX Registry
              working-directory: vscode
              env:
                  OVSX_PAT: ${{ secrets.OVSX_PAT }}
              run: bunx ovsx publish simple-light.vsix --skip-duplicate
